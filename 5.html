<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f9d52">
<link rel="manifest" href="/manifest.webmanifest">
<title>Carrera de tortugas – Overlay</title>
<style>
  :root{--sand:#ecd49a;--sand2:#e3c78a;--ink:#2b3a1f;--leaf:#4f9d52;--panel:#dff3e4;--gut:122px;--lane:160px;--safe-t:0px;--safe-b:270px;--safe-l:12px;--safe-r:56px}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:transparent;font-family:"Trebuchet MS","Segoe UI",sans-serif;overflow:hidden}
  /* LIENZO VERTICAL 9:16 (720×1280, se escala a 1080×1920 o a lo que sea). Zonas seguras = espacio que tapa la interfaz de TikTok Live: arriba (perfil/espectadores), abajo (chat/regalos) y derecha (botones). Ajustables en :root o con ?safe=0 */
  #app{display:flex;flex-direction:column;width:720px;min-height:1280px;padding:var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l)}
  .chips{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;background:var(--panel);border:3px solid var(--leaf);border-radius:16px;padding:8px 10px;margin-bottom:10px}
  .chips small{width:100%;text-align:center;font-weight:700;font-size:12px;color:var(--ink)}
  .chip{display:flex;align-items:center;gap:5px;font-weight:800;font-size:13px;color:var(--ink)}
  .chip svg{width:26px;height:18px;border-radius:3px;border:1px solid var(--ink)}
  .track{position:relative;display:flex;flex-direction:column;flex:1 1 auto;justify-content:flex-start;background:transparent;overflow:visible}
  #lanes{display:flex;flex-direction:column;gap:8px}
  .lane{position:relative;flex:none;height:var(--lane);border:4px solid var(--edge,var(--leaf));border-radius:14px;overflow:visible}
  .lane{background-color:var(--l1,var(--sand));background-image:var(--pat,none);background-size:var(--psz,auto)}
  .lane:nth-child(even){background-color:var(--l2,var(--sand2))}
  .lane::before{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--gut);background:var(--gt,#0001)}
  .label{position:absolute;left:4px;top:4px;bottom:4px;width:114px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;z-index:3;color:var(--ink2,var(--ink))}
  .label svg{width:22px;height:15px;border:1px solid var(--ink2,var(--ink));border-radius:3px;flex:none}
  .label b{display:block;font-size:17px;line-height:1.1;max-width:114px;color:#fff;background:#000d;padding:5px 8px;border-radius:10px;text-shadow:0 1px 0 #000}
  .fan-grid{display:grid;grid-template-columns:repeat(2,52px);grid-template-rows:repeat(2,52px);gap:3px;width:107px}
  .fan-grid .avw{position:relative;width:52px;height:52px;margin:0}
  .fan-grid .av{width:52px;height:52px;border-width:4px;border-color:var(--lc,#fff);box-shadow:0 0 0 2px #0007,0 0 10px var(--lc,#fff0)}
  .fan-grid .av i{font-size:22px}
  .fan-grid .ev{left:auto;right:-4px;bottom:-4px;margin:0;width:22px;height:22px;border-width:2px;font-size:12px}
  .fan-grid .lv{position:absolute;left:-3px;top:-3px;z-index:3;min-width:24px;padding:1px 4px;border-radius:9px;background:var(--lc);color:#1b1200;font-size:11px;font-weight:900;line-height:14px;text-align:center;border:2px solid #000a}
  .fan-grid .mvp{position:absolute;left:50%;top:-17px;margin-left:-9px;font-size:18px;z-index:4;filter:drop-shadow(0 1px 0 #0008);animation:bob 1s ease-in-out infinite alternate}
  .fan-grid .l4 .av{animation:aura 1.2s ease-in-out infinite alternate}
  .fan-grid .more{position:absolute;right:-2px;bottom:-2px;margin:0;padding:2px 6px;font-size:14px;z-index:4}
  .l1{--lc:#d9d9d9}.l2{--lc:#6fd36f}.l3{--lc:#4aa8ff}.l4{--lc:#ffc400}
  @keyframes bob{to{transform:translateY(-4px)}}
  @keyframes aura{to{box-shadow:0 0 0 2px #0007,0 0 18px 4px #ffc400}}
  .hop{position:absolute;left:70px;top:-36px;z-index:7;display:flex;flex-direction:column;align-items:center;pointer-events:none;animation:hop 1.4s ease-out forwards}
  .hop .av{width:66px;height:66px;border-width:4px;border-color:var(--lc,#fff);box-shadow:0 0 14px var(--lc,#fff)}
  .hop .av i{font-size:28px}
  .hop b{margin-top:-8px;padding:1px 9px;border-radius:10px;background:var(--lc);color:#1b1200;font-size:17px;font-weight:900;border:2px solid #000a;white-space:nowrap}
  @keyframes hop{0%{opacity:0;transform:translateY(30px) scale(.4)}15%{opacity:1;transform:translateY(-6px) scale(1.25)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-34px)}}
  .lane-num{display:inline-grid;place-items:center;width:20px;height:20px;margin-right:4px;border-radius:50%;background:#fff;color:var(--ink);font-size:12px;line-height:1;font-weight:900;vertical-align:1px;text-shadow:none}
  .label small{display:inline-block;margin-top:2px;font-size:10px;font-weight:800;color:#fff;background:#000a;padding:0 6px;border-radius:8px}
  .guide::after,.start::after,.finish::after{position:absolute;top:2px;font-size:9px;font-weight:800;color:var(--ink2,#0008);white-space:nowrap}
  .guide::after{content:attr(data-m);left:3px}
  .start::after{content:"0 m";left:4px}
  .finish::after{content:"100 m";right:14px}
  .bar{order:-1;flex:none;margin:0 0 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border:3px solid var(--leaf);border-radius:14px;padding:6px 8px 6px 14px;font-weight:800;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
  .bar .low{color:#b25e00}
  .bar #gifts{margin-left:auto;background:#fff1c2;border:2px solid #b8860b;color:#5a4100;border-radius:12px;padding:1px 12px;font-size:17px;font-weight:900}
  .bar #gifts.bump{animation:bump .45s ease-out}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
  #dot{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 2px var(--ink),0 0 8px var(--dc,#8a8f87);background:var(--dc,#8a8f87)}
  #dot.ok{--dc:#22c55e}
  #dot.wait{--dc:#facc15;animation:dotp 1s ease-in-out infinite}
  #dot.fail{--dc:#ef4444}
  #liveuser{max-width:145px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:800;color:var(--ink)}
  @keyframes dotp{50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){#dot.wait{animation:none}}
  .bar button{flex:none;border:0;background:var(--leaf);color:#fff;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
  .bar button svg{width:18px;height:18px}
  .bar button#snd{font-size:16px;line-height:1}
  .bar button#snd[aria-pressed="false"]{background:#8a8f87}
  .bar button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
  .comment-lane{order:-1;flex:none;min-height:212px;margin:0 0 8px;padding:6px 10px;border:3px solid var(--leaf);border-radius:14px;background:var(--panel);color:var(--ink)}
  .comment-title{display:block;margin-bottom:6px;font-size:13px;font-weight:900}
  #commentFeed{display:grid;gap:5px}
  .comment-entry{display:flex;align-items:center;gap:12px;min-height:72px;padding:8px 10px;border-radius:9px;background:#fff}
  .comment-entry .av{width:56px;height:56px}
  .comment-copy{display:grid;gap:2px;min-width:0}
  .comment-name{font-size:18px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .comment-text{font-size:19px;font-weight:800;line-height:1.25;overflow-wrap:anywhere}
  #countryDirectory{display:none}
  html.countryDirectory,html.countryDirectory body{overflow:auto;background:#edf7ef}
  html.countryDirectory #app,html.countryDirectory #status,html.countryDirectory #tp{display:none}
  html.countryDirectory #countryDirectory{display:block;width:min(900px,calc(100% - 24px));margin:16px auto;padding:18px;border:2px solid var(--leaf);border-radius:14px;background:#fff;color:var(--ink);font-family:system-ui,sans-serif}
  #countryDirectory h1{margin:0 0 12px;font-size:22px}
  #countryGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
  .country-card{display:flex;align-items:center;gap:9px;padding:8px;border:1px solid #c5d8c6;border-radius:8px;font-size:14px;font-weight:800}
  .country-card svg{flex:none;width:36px;height:26px;border:1px solid #65745f;border-radius:3px}
  #backToBackend{margin-bottom:14px;padding:8px 12px;border:0;border-radius:7px;background:var(--leaf);color:white;font-weight:800;cursor:pointer}
  .guide{position:absolute;top:0;bottom:0;border-left:2px dashed var(--gl,#0004);pointer-events:none}
  .start{position:absolute;top:0;bottom:0;left:var(--gut);border-left:3px solid #fff;pointer-events:none;z-index:1}
  .finish{position:absolute;top:0;bottom:0;right:0;width:12px;z-index:1;background:repeating-conic-gradient(#111 0 25%,#fff 0 50%) 0 0/12px 12px}
  .turtle{position:absolute;left:var(--gut);top:calc(var(--lane) - 147px - 3px);width:205px;height:147px;will-change:transform;z-index:2}
  .turtle>svg{width:100%;height:100%;overflow:visible}
  .crown{position:absolute;right:2px;top:-2px;font-size:15px;opacity:0;transition:opacity .3s;filter:drop-shadow(0 1px 0 #0006)}
  .leader .crown{opacity:1}
  .crew{position:absolute;left:0;top:-27px;height:88px;display:flex;align-items:center;z-index:3}
  .av{position:relative;flex:none;width:88px;height:88px;margin-left:0;border-radius:50%;border:3px solid #fff;overflow:hidden;
    display:inline-flex;align-items:center;justify-content:center;background:hsl(var(--h) 55% 42%);box-shadow:0 1px 3px #0006}
  .crew .avw{position:relative;display:inline-flex;margin-left:-26px}
  .crew .avw:first-child{margin-left:0}
  .ev{position:absolute;bottom:-10px;left:50%;margin-left:-18px;width:36px;height:36px;border-radius:50%;background:#fff;border:3px solid var(--ink);display:grid;place-items:center;font-size:20px;line-height:1;font-style:normal;z-index:2}
  .ev.follow{background:#e6ffe6}.ev.share{background:#e8e3ff}
  .ev.chat{background:#e3f2ff}.ev.like{background:#ffe3ea}.ev.gift{background:#fff1c2}
  .av i{font-style:normal;color:#fff;font-weight:800;font-size:35px}
  .av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .avw.pop{animation:pop .5s cubic-bezier(.3,1.7,.5,1)}
  .av.big{width:56px;height:56px;margin:0;border-width:3px}.av.big i{font-size:24px}
  .more{margin-left:4px;font-size:13px;font-weight:800;color:var(--ink);background:#fffc;border-radius:11px;padding:2px 7px}
  .nick{margin-left:7px;background:#000d;color:#fff;font-weight:800;font-size:17px;padding:5px 12px;border-radius:10px;white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis;animation:nick 2s forwards}
  .chatbubble{position:absolute;left:0;bottom:calc(100% + 8px);z-index:6;display:flex;align-items:center;gap:8px;max-width:560px;padding:6px 12px;border:1px solid #fff9;border-radius:12px;background:#10151fee;color:#fff;font-size:14px;line-height:1.2;white-space:nowrap;overflow:hidden;box-shadow:0 2px 8px #0006;pointer-events:none;animation:chatpop 8s forwards}
  .chatbubble span{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:24px;font-weight:900;line-height:1.2;white-space:nowrap}
  @keyframes chatpop{0%,80%{opacity:1}100%{opacity:0}}
  .gain{position:absolute;left:26px;top:44px;z-index:6;pointer-events:none;font-weight:900;font-size:14px;color:#fff;background:#000d;padding:2px 8px;border-radius:10px;white-space:nowrap;animation:gain 1.1s ease-out forwards}
  .gain.turbo{font-size:18px;background:linear-gradient(90deg,#ff6a00,#ffb000);color:#2b1400;box-shadow:0 0 14px #ff8a00;animation:gainT 1.7s ease-out forwards}
  @keyframes gainT{0%{opacity:0;transform:translateY(10px) scale(.5)}15%{opacity:1;transform:scale(1.25)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
  .turtle.turbo>svg{filter:drop-shadow(0 0 6px #ffb000) drop-shadow(0 0 14px #ff5a00)}
  .turtle.turbo::before{content:"🔥💨";position:absolute;right:100%;margin-right:-16px;top:34px;font-size:30px;z-index:-1;white-space:nowrap;animation:flick .16s infinite alternate}
  @keyframes flick{from{transform:translateX(0) scale(1)}to{transform:translateX(-6px) scale(1.15)}}
  @keyframes gain{0%{opacity:0;transform:translateY(8px) scale(.6)}18%{opacity:1;transform:translateY(0) scale(1.15)}35%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-18px)}}
  @keyframes pop{0%{transform:scale(.3) translateY(10px)}100%{transform:none}}
  @keyframes nick{0%{opacity:0;transform:translateX(-8px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
  .pct{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-weight:800;font-size:13px;color:#fff;background:#000a;padding:1px 8px;border-radius:9px;z-index:3}
  .pct:empty{display:none}
  #winner{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:6px;z-index:5;background:#2b3a1fe6;color:#fff;text-align:center;font-weight:800}
  #winner.show{display:flex}
  #winner b{font-size:32px}
  #winner>span{font-size:14px;opacity:.9}
  .wf svg{width:64px;height:44px;border:2px solid #fff;border-radius:6px}
  .mvps{display:flex;gap:16px;margin-top:6px}
  .mvp{display:flex;flex-direction:column;align-items:center;width:84px}
  .mvp em{font-style:normal;font-size:12px;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mvp small{font-size:11px;opacity:.8}
  #status{z-index:60;position:fixed;bottom:4px;left:6px;font-size:11px;color:#fff;background:#0008;padding:2px 6px;border-radius:6px;display:none}
  .sname{position:absolute;left:50%;top:6px;transform:translateX(-50%);z-index:4;background:#000b;color:#fff;font-weight:800;font-size:12px;padding:3px 12px;border-radius:12px;opacity:0;pointer-events:none;white-space:nowrap}
  .sname.show{animation:sn 3.2s forwards}
  @keyframes sn{0%{opacity:0;transform:translate(-50%,-6px)}10%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
  .emote{position:absolute;right:-6px;top:-8px;font-size:16px;opacity:0;z-index:4;pointer-events:none}
  .emote.pop{animation:emo 1.8s forwards}
  .emote.loop{animation:zz 2.4s infinite}
  @keyframes emo{0%{opacity:0;transform:translateY(6px) scale(.4)}15%{opacity:1;transform:scale(1.25)}28%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
  @keyframes zz{0%,100%{opacity:.9;transform:translateY(0)}50%{opacity:.35;transform:translateY(-8px)}}
  @media (prefers-reduced-motion:reduce){.turtle.turbo::before,.gain.turbo{animation:none}.bar #gifts.bump{animation:none}.gain{animation:none}.avw.pop,.nick,.emote.pop,.emote.loop{animation:none}.emote.pop,.emote.loop{opacity:1}}
  #tp{position:fixed;right:8px;top:8px;width:216px;z-index:50;display:none;background:#10151cee;color:#fff;border-radius:12px;padding:10px;font:700 12px "Trebuchet MS","Segoe UI",sans-serif;box-shadow:0 4px 16px #0008}
  #tp.on{display:block}
  #tp h4{margin:0 0 8px;font-size:12px;display:flex;justify-content:space-between;align-items:center}
  #tp h4 span{font-weight:600;opacity:.6}
  #tp .g{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  #tp button{border:0;border-radius:8px;padding:8px 4px;background:#243040;color:#fff;font:inherit;cursor:pointer;text-align:center}
  #tp button:hover{background:#34465e}
  #tp button:active{transform:scale(.96)}
  #tp button:focus-visible{outline:2px solid #6ec1ff;outline-offset:1px}
  #tp .wide{grid-column:1/-1}
  #tp .win{background:#2f7d3a}#tp .win:hover{background:#3a9748}
  #tp .nx{background:#5a3f93}#tp .nx:hover{background:#6e4db3}
  @media (prefers-reduced-motion:reduce){#tp button:active{transform:none}}
  .fxl{position:absolute;inset:0;z-index:7;pointer-events:none;overflow:hidden;border-radius:14px}
  .toasts{position:absolute;top:8px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px}
  .toast{background:#000d;color:#fff;font-weight:900;font-size:20px;padding:6px 16px;border-radius:14px;border:2px solid #ffd75e;box-shadow:0 0 14px #ffb00088;max-width:94%;text-align:center;animation:tin .3s cubic-bezier(.3,1.7,.5,1),tout .4s 2.8s forwards}
  .toast.gift{background:linear-gradient(90deg,#ff6a00,#ffb000);color:#2b1400;border-color:#fff}
  @keyframes tin{from{opacity:0;transform:scale(.5) translateY(-10px)}}
  @keyframes tout{to{opacity:0}}
  .cf{position:absolute;top:0;font-style:normal;will-change:transform}
  .podium{display:flex;gap:16px;margin:4px 0}
  .pod{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px}
  .pod>span{font-size:22px}.pod svg{width:44px;height:30px;border:2px solid #fff;border-radius:5px}.pod small{opacity:.8;font-size:11px}
  .bar #gifts{transition:background .4s}

  /* ROSITA (CTA): solo el emoji, sin recuadro ni texto. Titila sobre las 3 pistas con más interacción */
  .rosa-cta{position:absolute;right:34px;top:50%;width:auto;font-size:min(110px,calc(var(--lane) * .55));line-height:1;transform:translateY(-50%);z-index:6;pointer-events:none;filter:drop-shadow(0 3px 6px #0009);animation:rosaBlink .9s ease-in-out infinite}
  @keyframes rosaBlink{0%,100%{opacity:1;scale:1}50%{opacity:.15;scale:1.18}}

  /* ---- CTA gamificado: entrada con rebote, chispas orbitando y pista dorada pulsando ---- */
  .rosa-cta{animation:rosaPop .65s cubic-bezier(.3,1.8,.5,1),rosaBlink .9s .65s ease-in-out infinite}
  @keyframes rosaPop{0%{scale:.1;opacity:0}100%{scale:1;opacity:1}}
  .rosa-cta s{position:absolute;left:50%;top:50%;text-decoration:none;font-size:.3em;animation:orb 1.6s linear infinite;animation-delay:var(--d,0s)}
  @keyframes orb{from{transform:translate(-50%,-50%) rotate(0) translateX(.95em) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg) translateX(.95em) rotate(-360deg)}}
  .lane.rosa-glow{animation:laneGlow .6s ease-in-out infinite alternate;z-index:5}
  @keyframes laneGlow{from{box-shadow:0 0 0 0 #ffd54000}to{box-shadow:0 0 22px 6px #ffd540,inset 0 0 18px #ffd54088}}

  /* ---- FESTEJO DE REGALO (súper alarma de fiesta) ---- */
  #fiesta{position:fixed;inset:0;z-index:9000;pointer-events:none;display:none;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",sans-serif}
  #fiesta.on{display:block;animation:fiIn .25s ease-out}
  #fiesta.out{animation:fiOut .5s forwards}
  @keyframes fiIn{from{opacity:0}to{opacity:1}}
  @keyframes fiOut{to{opacity:0}}
  #fiesta .ry{position:absolute;left:-50%;top:-50%;width:200%;height:200%;background:repeating-conic-gradient(from 0deg at 50% 50%,#ffd54066 0 9deg,#0000 9deg 18deg);animation:fiSpin 4s linear infinite}
  @keyframes fiSpin{to{transform:rotate(360deg)}}
  #fiesta .ed{position:absolute;inset:0;border:2vw solid #ff4081;box-shadow:inset 0 0 8vw #ffd540;animation:fiHue .8s linear infinite}
  @keyframes fiHue{from{filter:hue-rotate(0)}to{filter:hue-rotate(360deg)}}
  #fiesta .bx{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:94vw;text-align:center}
  #fiesta .ic{font-size:34vw;line-height:1;filter:drop-shadow(0 1.5vw 2vw #0009);animation:fiBounce .55s ease-in-out infinite alternate}
  @keyframes fiBounce{from{transform:scale(.92) rotate(-6deg)}to{transform:scale(1.12) rotate(6deg)}}
  #fiesta .tt{font-size:15vw;line-height:1;font-weight:900;color:#fff176;-webkit-text-stroke:.8vw #b8000a;paint-order:stroke fill;text-shadow:0 1.2vw 0 #b8000a,0 0 5vw #ff9100;animation:fiBounce .4s ease-in-out infinite alternate}
  #fiesta .nn{display:inline-block;max-width:90vw;margin-top:2.5vw;padding:1.2vw 4vw;border-radius:5vw;background:#000c;color:#fff;font-size:6.5vw;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #fiesta .nn:empty{display:none}
  #fiesta.mega .ed{border-width:3.4vw}
  #fiesta .fw{position:absolute;pointer-events:none;line-height:1}
</style>
</head>
<body>
<div id="app">
  <div class="track" id="track">
    <div id="lanes"></div>
    <div id="winner"></div>
    <div class="sname" id="stylename"></div>
    <div class="fxl" id="fxl"><div class="toasts" id="toasts"></div></div>
  </div>
  <div class="bar" id="bar">
    <span id="dot" class="off" role="status" aria-label="Sin backend" title="Sin backend"></span>
    <span id="liveuser" aria-label="Usuario conectado"></span>
    <span id="clock">⏱ 00:00:00</span>
    <span id="rate">⚡ 0 ev/min</span>

function initializeRace(previousResults){
  if(raceInitialized) return;
  const previousTop = Array.isArray(previousResults)
    ? previousResults
      .filter(result=>result && ALL_COUNTRIES.some(c=>c.id===result.id) && Number.isSafeInteger(result.interactions) && result.interactions > 0)
      .sort((a,b)=>b.interactions-a.interactions)
      .slice(0,MAX_LANES)
    : [];
  nextCountries = previousTop.map(result=>ALL_COUNTRIES.find(c=>c.id===result.id)).filter(Boolean);
  raceInitialized = true;
  reset();
}

/* Reparte el alto vertical disponible entre los carriles (mín. 150 px; con más de 4-5 carriles el overlay entero se reescala para entrar, hasta 8) */
function layoutVertical(){
  const app = document.getElementById('app'), cs = getComputedStyle(document.documentElement), px = v => parseFloat(cs.getPropertyValue(v)) || 0;
  const n = Math.max(1, COUNTRIES.length);
  const others = document.getElementById('bar').offsetHeight + 10 + document.querySelector('.comment-lane').offsetHeight + 8;
  const avail = 1280 - px('--safe-t') - px('--safe-b') - others - 8*(n-1);
  const lh = Math.max(150, Math.min(230, Math.floor(avail / n)));
  document.getElementById('track').style.setProperty('--lane', lh + 'px');
}
function render(){
  layoutVertical();
  const run = document.getElementById('track').clientWidth - GUT - TW - 16;
  document.querySelectorAll('.guide').forEach(g=>g.style.left = (GUT + TW + Number(g.dataset.f)*run) + 'px');
  const max = Math.max(...Object.values(state));
  const members = {}; Object.values(lastChoice).forEach(id=>members[id]=(members[id]||0)+1);
  COUNTRIES.forEach(c=>{
    const t = document.getElementById('t-'+c.id);
    if(rig[c.id]) rig[c.id].target = Math.min(state[c.id]/CONFIG.GOAL,1)*run;
    t.classList.toggle('leader', max>0 && state[c.id]===max);
    document.getElementById('p-'+c.id).textContent = state[c.id] ? state[c.id] + ' m' : '';
  });
}

const LV_AT = [0,3,10,25], lvOf = (id,u) => { const m = (contrib[id]||{})[u]||0; let n = 0; LV_AT.forEach((v,i)=>{ if(m>=v) n=i; }); return n+1; };
function drawCrew(id, pop){
  const list = [...crew[id]].sort((a,b)=>((contrib[id]||{})[b]||0)-((contrib[id]||{})[a]||0));
  const N = list.length > 4 ? 3 : 4, shown = list.slice(0,N), top = (contrib[id]||{})[shown[0]] > 0 ? shown[0] : null;
  document.getElementById('c-'+id).innerHTML = shown.map(u=>{
    const L = lvOf(id,u);
    return avBadge(u, (u===pop?'pop ':'') + 'l'+L).replace('</span><b class="ev', `<i class="lv">Nv${L}</i>${u===top?'<s class="mvp">👑</s>':''}</span><b class="ev`);
  }).join('') + (list.length>N ? `<span class="more">+${list.length-N}</span>` : '');
}

/* ============ FÍSICA ============
   Cada tortuga es un cuerpo con gravedad y resortes amortiguados:
   - avanza deslizándose lento hacia su meta (resorte), sin saltos bruscos
   - cada punto la hace dar un pequeño salto; al caer se aplasta y rebota
   - cabeza y cola cuelgan con peso y se balancean por inercia (se quedan atrás al arrancar)
   - las 4 patas caminan en diagonal, despacio incluso en reposo, desde que carga el overlay */
const G = 1400, RM = matchMedia('(prefers-reduced-motion: reduce)').matches ? .3 : 1;
const rig = {}, LEG_OFF = [Math.PI, 0, 0, Math.PI];
const spr = (o, rest, k, c, dt, f=0) => { o.w += (k*(rest-o.a) - c*o.w + f)*dt; o.a += o.w*dt; };

function makeRig(c){
    const el = document.getElementById('t-'+c.id), q = x => el.querySelector(x);
    rig[c.id] = { el, shell:q('.shell'), head:q('.head'), tail:q('.tail'), shd:q('.shd'),
      hp:q('.head').dataset.p.split(','), tp:q('.tail').dataset.p.split(','),
      legs:[...el.querySelectorAll('.leg')].map(g=>({g, p:g.dataset.p.split(',')})),
      x:0, vx:0, y:0, vy:0, target:0, phase:Math.random()*6.28, ph:Math.random()*6.28,
      H:{a:6,w:0}, T:{a:-5,w:0}, P:{a:0,w:0}, S:{a:0,w:0},
      id:c.id, em:q('.emote'), mp:q('.mp'), mo:q('.mo'), tr:q('.tr'), sg:q('.sg'), bls:[...el.querySelectorAll('.bl')],
      eyes:[...el.querySelectorAll('.eye')].map(g=>({R:+g.dataset.r, x:+g.dataset.x, ew:g.querySelector('.ew'), ep:g.querySelector('.ep'), ea:g.querySelector('.ea'), eb:g.querySelector('.eb')})),
      turbo:0, m:{...MOODS.calm}, base:'calm', ov:'', ovUntil:0, lastPush:T0, rank:0, won:false, nb:1+Math.random()*3, blink:0 };
}

function makeRigs(){
  Object.keys(rig).forEach(k=>delete rig[k]);
  COUNTRIES.forEach(makeRig);
}

function addCountryToRace(country){
  if(COUNTRIES.some(c=>c.id===country.id)) return true;
  if(COUNTRIES.length>=MAX_LANES || !racing) return false;
  const added={...country};
  COUNTRIES.push(added);
  state[added.id]=0; crew[added.id]=[]; contrib[added.id]={}; countryInteractions[added.id]=0;
  document.getElementById('lanes').insertAdjacentHTML('beforeend', laneMarkup(added, COUNTRIES.length-1));
  makeRig(added);
  render(); fitScreen();
  SFX.play('join'); toast(`🌍 ¡${esc(added.name)} entra a la carrera!`);
  return true;
}
/* ============ ESTADO ANÍMICO ============
   La cara se arma con parámetros que se suavizan hacia el ánimo actual:
   mc=sonrisa(+)/ceño(-)  mo=boca abierta  eo=ojos abiertos  hp=ojos felices ^ ^  br=cejas (+tristes, -enojadas)
   bl=rubor  tr=lágrima  hd=cabeza (+baja)  spd=ritmo de pasos  sg=lentes de sol */
const M = o => ({mc:.35,mo:0,eo:1,hp:0,br:0,bl:0,tr:0,hd:0,spd:1,sg:0,...o});
const MOODS = {
  calm:   M({}),
  smug:   M({mc:.7, eo:.8, br:-.2, bl:.2, hd:-4, spd:1.1, sg:1}),   // líder: lentes de sol
  happy:  M({mc:1, mo:.15, hp:1, br:.1, bl:.6, hd:-3, spd:1.3}),
  excited:M({mc:1, mo:.8, eo:1.25, br:.2, bl:.4, hd:-6, spd:2}),   // recién empujada
  love:   M({mc:1, mo:.2, hp:1, br:.2, bl:1, hd:-2, spd:1.2}),     // regalo
  sad:    M({mc:-1, eo:.8, br:1, tr:1, hd:10, spd:.55}),           // muy atrás / perdió
  worried:M({mc:-.2, mo:.25, eo:1.2, br:.8, hd:2, spd:1.5}),       // cerca de la meta
  angry:  M({mc:-.7, mo:.1, eo:.8, br:-1, hd:3, spd:1.6}),         // la pasaron
  sleepy: M({mc:.1, eo:.12, br:.3, hd:12, spd:.35}),               // sin empujones por 12 s
  win:    M({mc:1, mo:.9, hp:1, bl:.8, hd:-8, spd:2.2})
};
function say(r, e, loop){ // emoji flotante sobre la cabeza
  r.em.textContent = e; r.em.className = 'emote'; void r.em.offsetWidth;
  r.em.className = 'emote ' + (loop ? 'loop' : 'pop');
}
function unsay(r){ r.em.className = 'emote'; r.em.textContent = ''; }
function react(r, mood, dur, emoji){ r.ov = mood; r.ovUntil = T0 + dur; if(emoji) say(r, emoji); }

function moods(){ // se evalúa 4 veces por segundo
  COUNTRIES.forEach(c=>{ // los avatares salen de la pista tras CREW_TTL s sin actividad
    const l = crew[c.id]; if(!l || !l.length) return;
    const keep = l.filter(u => T0 - (act[u] ? act[u].t : 0) < CONFIG.CREW_TTL);
    if(keep.length !== l.length){ crew[c.id] = keep; drawCrew(c.id); }
  });
  const vals = COUNTRIES.map(c=>state[c.id]), max = Math.max(...vals);
  const ld = max >= 8 ? COUNTRIES.filter(c=>state[c.id]===max) : [];
  if(racing && ld.length === 1){ if(lastLead && lastLead !== ld[0].id){ SFX.play('lead'); toast(`👑 ¡${esc(ld[0].name)} toma la delantera!`); } lastLead = ld[0].id; }
  COUNTRIES.forEach(c=>{
    const r = rig[c.id]; if(!r) return;
    const sc = state[c.id], rank = 1 + vals.filter(v=>v>sc).length, p = sc/CONFIG.GOAL;
    if(racing && max >= 4 && r.rank && r.ovUntil < T0){
      if(rank > r.rank){ react(r,'angry',2,'💢'); SFX.play('lost'); }          // la pasaron
      else if(rank < r.rank){ react(r,'happy',1.6,'✨'); SFX.play('pass'); }   // adelantó
    }
    r.rank = rank;
    let m = 'calm';
    if(!racing) m = r.won ? 'win' : 'sad';
    else if(T0 - r.lastPush > 12) m = 'sleepy';
    else if(max > 0 && sc === max) m = p > .85 ? 'worried' : 'smug';
    else if(max - sc > CONFIG.GOAL*.18) m = 'sad';
    else if(p > .85) m = 'worried';
    if(m !== r.base){
      if(m === 'worried') say(r,'💦');
      if(m === 'sleepy') say(r,'💤',true);
      else if(r.base === 'sleepy') unsay(r);
      r.base = m;
    }
  });
}

function face(r, dt){
  const tg = MOODS[r.ovUntil > T0 ? r.ov : r.base], m = r.m, k = Math.min(1, dt*7);
  for(const key in tg) m[key] += (tg[key] - m[key])*k;
  if(T0 > r.nb){ r.blink = T0 + .13; r.nb = T0 + 2 + Math.random()*3.5; }   // parpadeo
  const wide = Math.min(1.3, m.eo), eo = wide*(T0 < r.blink ? .08 : 1), hp = m.hp > .5;
  r.eyes.forEach((e,i)=>{
    const R = e.R;
    e.ew.setAttribute('ry', Math.max(.5, R*eo)); e.ew.setAttribute('opacity', hp?0:1);
    e.ep.setAttribute('ry', Math.max(.3, Math.min(R*.45, R*eo*.8))); e.ep.setAttribute('cy', 35 + m.tr*1.3); e.ep.setAttribute('opacity', hp?0:1);
    e.ea.setAttribute('opacity', hp?1:0);
    e.eb.setAttribute('transform', `translate(0 ${-(wide-1)*3}) rotate(${m.br*26*(i===0?-1:1)} ${e.x} ${35-R-2.5})`);
  });
  r.mp.setAttribute('d', `M103 45 Q108.5 ${45 + m.mc*4.5} 114 45`);
  const oy = m.mo*3.8;
  r.mo.setAttribute('ry', Math.max(0,oy)); r.mo.setAttribute('cy', 45 + m.mo*1.5); r.mo.setAttribute('opacity', oy > .4 ? 1 : 0);
  r.bls.forEach(b=>b.setAttribute('opacity', Math.max(0,m.bl)*.8));
  r.tr.setAttribute('opacity', Math.max(0,m.tr)); r.sg.setAttribute('opacity', Math.max(0,m.sg));
}

function kick(id){ // empujón: carita emocionada + pequeño salto (solo si está en el suelo)
  const r = rig[id]; if(!r) return;
  r.lastPush = T0;
  if(r.ovUntil < T0 || r.ov === 'excited') react(r,'excited',1);
  if(r.y > -1){ r.vy = -150*TW/112; r.H.w -= 60; r.T.w += 40; }
}
let tPrev = performance.now(), T0 = 0, mt = 0;
function frame(now){
  const dt = Math.min(.033, (now - tPrev)/1000); tPrev = now; T0 += dt;
  if(T0 - mt > .25){ mt = T0; moods(); }
  for(const r of Object.values(rig)){
    const tb = T0 < r.turbo;                              // TURBO: resorte más rígido = arranca y llega rápido
    const ax = (tb?30:10)*(r.target - r.x) - (tb?9.5:5.5)*r.vx;   // avance lento y amortiguado
    r.vx += ax*dt; r.x += r.vx*dt;
    r.vy += G*dt; r.y += r.vy*dt;                        // gravedad
    if(r.y > 0){                                         // aterriza: rebote pequeño + aplastamiento
      const imp = r.vy; r.y = 0; r.vy = imp > 80 ? -imp*.18 : 0;
      if(imp > 80){ r.S.w += imp*.5; r.H.w += imp*.25; r.T.w -= imp*.15; }
    }
    const sp = Math.min(Math.abs(r.vx), 220);
    r.phase += dt*(1.4 + sp*.014)*r.m.spd*(tb?2.2:1);                       // paso lento, siempre activo
    const amp = (13 + sp*.05)*RM, bob = -Math.abs(Math.sin(r.phase))*1.2*RM;
    spr(r.H, 6 + r.m.hd + (Math.sin(T0*.9 + r.ph)*4 + Math.sin(r.phase*2)*2)*RM, 45, 6, dt, -ax*1.4); // cabeza: peso + inercia
    spr(r.T, -5 + Math.sin(T0*1.3 + r.ph)*7*RM, 40, 5, dt, ax*1.1);                           // cola
    spr(r.P, -ax*.04, 30, 6, dt);                        // cabeceo del caparazón
    spr(r.S, 0, 120, 9, dt);                             // aplastamiento
    const yy = r.y + bob;
    r.el.classList.toggle('turbo', tb);
    r.el.style.transform = `translate3d(${r.x}px,${yy}px,0)`;
    r.shell.setAttribute('transform', `translate(60 72) rotate(${r.P.a}) scale(${1 + r.S.a*.006} ${1 - r.S.a*.01}) translate(-60 -72)`);
    r.head.setAttribute('transform', `rotate(${r.H.a} ${r.hp[0]} ${r.hp[1]})`);
    r.tail.setAttribute('transform', `rotate(${r.T.a} ${r.tp[0]} ${r.tp[1]})`);
    r.legs.forEach((l,i)=>{
      const ph = r.phase + LEG_OFF[i];
      l.g.setAttribute('transform', `translate(0 ${-Math.max(0,Math.cos(ph))*2.5*RM}) rotate(${Math.sin(ph)*amp} ${l.p[0]} ${l.p[1]})`);
    });
    r.shd.setAttribute('transform', `translate(0 ${-yy/(TW/120)}) translate(60 81) scale(${Math.max(.5,1 + yy*.03)}) translate(-60 -81)`);
    face(r, dt);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ============ RELOJ, EVENTOS/MIN Y AUTO-AVANCE ============ */
const t0 = Date.now(), evts = [];
const pad = n => String(n).padStart(2,'0');
function countEvent(weight = 1){ // COMBO: eventos seguidos (<3 s entre ellos) → sonido + aviso en 5/10/20/40/80
  const n = Date.now();
  for(let i = 0; i < weight; i++) evts.push(n);
  cN = (n - cT < 3000) ? cN + 1 : 1; cT = n;
  if(COMBOS.includes(cN)){ SFX.play('combo'); toast(`🔥 COMBO ×${cN}`); confetti(Math.min(cN,40)); }
}
function evPerMin(){ // chats + likes + regalos en los últimos 60 s (proyectado mientras el overlay lleva menos de 1 min)
  const now = Date.now();
  while(evts.length && now - evts[0] > 60000) evts.shift();
  return evts.length * 60 / Math.min(60, Math.max(10, (now - t0)/1000));
}
function tick(){
  const sec = Math.floor((Date.now() - t0)/1000), r = evPerMin(), low = r < CONFIG.LOW_RATE;
  document.getElementById('clock').textContent = `⏱ ${pad(sec/3600|0)}:${pad(sec/60%60|0)}:${pad(sec%60)}`;
  const el = document.getElementById('rate');
  el.textContent = `⚡ ${Math.round(r)} ev/min` + (low ? ' · auto' : '');
  el.classList.toggle('low', low);
}
setInterval(tick, 500);
document.getElementById('reload').addEventListener('click', () => location.reload());

/* Con poca actividad, una tortuga al azar avanza 1–2 m cada pocos segundos. Nunca cruza la meta sola. */
function autoStep(){
  if(racing && evPerMin() < CONFIG.LOW_RATE){
    const opts = COUNTRIES.filter(c => state[c.id] < CONFIG.GOAL - 1);
    if(opts.length){
      const c = opts[Math.random()*opts.length|0];
      const m = Math.min(CONFIG.AUTO_MIN + (Math.random()*(CONFIG.AUTO_MAX - CONFIG.AUTO_MIN + 1)|0), CONFIG.GOAL - 1 - state[c.id]);
      addPoints(c.id, m);
    }
  }
  setTimeout(autoStep, CONFIG.AUTO_EVERY[0] + Math.random()*(CONFIG.AUTO_EVERY[1] - CONFIG.AUTO_EVERY[0]));
}
setTimeout(autoStep, CONFIG.AUTO_EVERY[0]);


/* ============ ROSITA TITILANTE (CTA) ============
   Cada 1 minuto se mira ev/min (el mismo valor que muestra la barra). Si supera 50, aparece una rosita grande titilando
   durante 8 s en las 3 pistas con más interacciones de la carrera actual. Si ev/min es 50 o menos, ese minuto no se muestra.
   Reglas TikTok: solo el emoji, sin texto que pida regalos ni promesas. */
const ROSA = {EVM_MIN:50, SHOW_MS:8000, EVERY_MS:60000, TOP:3};
function rosaCheck(){
  document.querySelectorAll('.rosa-cta').forEach(e => e.remove());
  document.querySelectorAll('.lane.rosa-glow').forEach(e => e.classList.remove('rosa-glow'));
  if(!racing || evPerMin() <= ROSA.EVM_MIN) return;
  let list = COUNTRIES.map(c => ({id:c.id, n:countryInteractions[c.id]||0, s:state[c.id]||0}))
    .filter(x => x.n > 0)
    .sort((a,b) => b.n - a.n || b.s - a.s)
    .slice(0, ROSA.TOP);
  if(!list.length) list = COUNTRIES.slice(0, ROSA.TOP).map(c => ({id:c.id}));
  let shown = 0;
  list.forEach(x => {
    const lane = document.getElementById('lane-' + x.id); if(!lane) return;
    const r = document.createElement('span');
    r.className = 'rosa-cta'; r.setAttribute('aria-hidden','true');
    r.innerHTML = '🌹<s style="--d:0s">✨</s><s style="--d:-.55s">💖</s><s style="--d:-1.1s">✨</s>';
    lane.appendChild(r); lane.classList.add('rosa-glow'); shown++;
    setTimeout(() => { r.remove(); lane.classList.remove('rosa-glow'); }, ROSA.SHOW_MS);
  });
  if(shown){   // sonido + lluvia de brillos: ¡llegó la rosita!
    SFX.play('cta'); confetti(18, ['🌹','✨','💖','⭐']);
    [1500,3000,4500].forEach(ms => setTimeout(() => SFX.play('ctatick'), ms));
  }
}
setInterval(rosaCheck, ROSA.EVERY_MS);


/* ============ SONIDO (gamificado) ============
   Todo sintetizado con Web Audio: no hay archivos de audio. Cada evento suena distinto,
   y comentarios/likes forman una escalera de notas: mientras más seguidos, más agudo (combo, se reinicia a los 2,5 s).
   Hitos: primera tortuga en pasar 25/50/75 m (campana), última recta (85 m) y fanfarria al ganar. */
const SFX = (() => {
  let ctx = null, master = null, combo = 0, lastCombo = 0;
  const lastAt = {}, SCALE = [0,2,4,5,7,9,11,12];
  let on = new URLSearchParams(location.search).get('mute') !== '1';
  const note = n => 523.25 * Math.pow(2, n/12);                       // C5 + semitonos
  const ok = (k, ms) => { const t = performance.now(); if(lastAt[k] && t - lastAt[k] < ms) return false; lastAt[k] = t; return true; };
  function ac(){
    if(!ctx){
      try{
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        master = ctx.createGain(); master.gain.value = CONFIG.VOLUME;
        const comp = ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination);
      }catch(e){ return null; }
    }
    if(ctx.state === 'suspended') ctx.resume().catch(()=>{});
    return ctx;
  }
  function tone(f, at, dur, type, vol, to){
    const t = ctx.currentTime + at, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    if(to) o.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .03);
  }
  function noise(dur, at, vol){ // ruido filtrado = aplauso / multitud
    const t = ctx.currentTime + at, n = ctx.sampleRate*dur|0, b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = (Math.random()*2-1)*(1 - i/n);
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    f.type = 'bandpass'; f.frequency.value = 2500; s.buffer = b; g.gain.value = vol; s.connect(f); f.connect(g); g.connect(master); s.start(t);
  }
  function step(){ const n = Date.now(); combo = (n - lastCombo < 2500) ? Math.min(combo + 1, 7) : 0; lastCombo = n; return note(SCALE[combo]); }
  const fx = {
    chat(){ if(ok('chat',90))  tone(step(), 0, .13, 'triangle', .14); },
    like(){ if(ok('like',70))  tone(step() * 1.5, 0, .07, 'square', .05); },
    follow(){ tone(note(0), 0, .2, 'triangle', .22); tone(note(7), .09, .26, 'triangle', .22); tone(note(16), .2, .3, 'sine', .1); },
    share(){ tone(260, 0, .26, 'sawtooth', .07, 1300); [4,7,12].forEach((n,i)=>tone(note(n), .12 + i*.08, .2, 'sine', .2)); },
    gift(){ tone(988, 0, .09, 'square', .12); tone(1319, .08, .55, 'square', .12); tone(2637, .16, .35, 'sine', .1); tone(3136, .26, .3, 'sine', .07); },
    pass(){ if(ok('pass',500)) tone(480, 0, .16, 'sine', .2, 960); },
    lost(){ if(ok('lost',800)) tone(240, 0, .22, 'sawtooth', .06, 120); },
    turbo(){ tone(180, 0, .7, 'sawtooth', .1, 1900); tone(90, 0, .55, 'square', .07, 900); tone(1760, .55, .3, 'sine', .12); },
    milestone(){ tone(880, 0, .55, 'sine', .22); tone(1320, 0, .45, 'sine', .1); },
    final(){ [0,.13,.26,.39].forEach(t=>tone(1000, t, .07, 'square', .08)); },
    join(){ tone(note(7), 0, .1, 'sine', .18); tone(note(14), .08, .22, 'sine', .18); },
    lead(){ [0,4,7].forEach((n,i)=>tone(note(n+12), i*.07, .16, 'square', .1)); tone(note(24), .24, .35, 'triangle', .14); },
    combo(){ [0,2,4,7,9,12].forEach((n,i)=>tone(note(n), i*.05, .12, 'triangle', .16)); },
    level(){ [0,4,7,12,16].forEach((n,i)=>tone(note(n+7), i*.08, .25, 'square', .1)); noise(.6, 0, .1); },
    turbo2(){ fx.turbo(); tone(note(19), .35, .5, 'sine', .16); tone(note(24), .5, .5, 'sine', .12); },
    mega(){ fx.turbo2(); [0,4,7,12,16,19,24].forEach((n,i)=>tone(note(n), .7 + i*.07, .5, 'triangle', .18)); noise(.9, .7, .15); },
    cheer(){ noise(1.8, 0, .22); },
    cta(){ [0,4,7,12,16].forEach((n,i)=>tone(note(n+12), i*.07, .3, 'sine', .2)); tone(note(28), .4, .6, 'triangle', .14); tone(3200, .1, .3, 'sine', .05, 6000); },
    ctatick(){ tone(note(24), 0, .12, 'sine', .1); },
    siren(){ for(let i=0;i<3;i++){ tone(650, i*.5, .48, 'sawtooth', .24, 1300); tone(325, i*.5, .48, 'square', .08, 650); } },
    back(){ [0,4,7,12].forEach((n,i)=>tone(note(n+7), i*.1, .25, 'triangle', .22)); },
    fiesta(){ // boom + fanfarria + silbidos + aplausos
      tone(140, 0, .5, 'sawtooth', .28, 40);
      [0,4,7,12,16,19,24].forEach((n,i)=>tone(note(n+7), .05 + i*.06, .4, 'square', .13));
      [0,.16,.32,.48].forEach(t=>tone(note(31), .55 + t, .14, 'triangle', .2));
      [0,.22,.44].forEach(t=>tone(2200, .3 + t, .3, 'sine', .1, 350));
      noise(1.6, .25, .3);
    },
    fiestaMega(){ fx.fiesta(); [0,4,7,12,16,19,24,28].forEach((n,i)=>tone(note(n+12), 1.1 + i*.07, .45, 'triangle', .18)); [0,.25,.5,.75].forEach(t=>tone(160, 1.1 + t, .35, 'sawtooth', .22, 40)); noise(1.8, 1.1, .32); },
    start(){ [0,.28,.56].forEach(t=>tone(440, t, .14, 'square', .08)); tone(880, .84, .32, 'square', .1); },
    win(){ [0,3,7,12].forEach((n,i)=>tone(note(n), i*.13, .2, 'triangle', .26)); [12,16,19].forEach(n=>tone(note(n), .6, 1, 'triangle', .16)); }
  };
  const api = {
    play(k){ if(!on || !CONFIG.SOUND || !fx[k]) return; if(ac() && ctx.state === 'running') fx[k](); }, // si el navegador aún bloquea el audio, no encola sonidos
    force(k){ if(!fx[k]) return; if(ac() && ctx.state === 'running') fx[k](); }, // ignora el mute (alarmas)
    unlock(){ ac(); },
    toggle(){ on = !on; if(on) ac(); return on; },
    get on(){ return on; }
  };
  const btn = document.getElementById('snd'), paint = () => { btn.textContent = on ? '🔊' : '🔇'; btn.setAttribute('aria-pressed', on); };
  paint();
  btn.addEventListener('click', () => { api.toggle(); paint(); api.play('follow'); });
  document.addEventListener('keydown', e => { if(e.key.toLowerCase()==='m'){ api.toggle(); paint(); api.play('follow'); } });
  ['pointerdown','keydown'].forEach(ev => document.addEventListener(ev, api.unlock, {once:true}));
  return api;
})();
let fxHit = {}, lastLead = null, lastWinner = null, streak = 0, giftLv = 1, cN = 0, cT = 0;
const COMBOS = [5,10,20,40,80];
const WINS = (()=>{ try{ return JSON.parse(localStorage.getItem('tr_wins')) || {}; }catch(e){ return {}; } })();
const saveWins = () => { try{ localStorage.setItem('tr_wins', JSON.stringify(WINS)); }catch(e){} };
function toast(html, cls=''){
  const box = document.getElementById('toasts'); if(!box) return;
  const t = document.createElement('div'); t.className = 'toast ' + cls; t.innerHTML = html; box.prepend(t);
  while(box.children.length > 3) box.lastElementChild.remove();
  setTimeout(()=>t.remove(), 3300);
}
function confetti(n=30, set=['🎉','✨','⭐','🎊']){
  const L = document.getElementById('fxl'); if(!L || RM < 1) return;
  const W = L.clientWidth, Hh = L.clientHeight;

    p.animate([{transform:'translateY(-30px) rotate(0)',opacity:1},{transform:`translateY(${Hh+40}px) rotate(${Math.random()*720-360}deg)`,opacity:.9}],
      {duration:1600+Math.random()*1600, delay:Math.random()*500, easing:'cubic-bezier(.3,.6,.6,1)'}).onfinish = () => p.remove();
  }
}


/* ============ ALARMA DE DESCONEXIÓN (SOLO SONIDO) ============
   Si se cae el servidor (WebSocket) o TikTok queda desconectado/fallido, a los 3 s suena una sirena en bucle para que el operador
   desconecte TikTok Live y lo reconecte. NO muestra ningún mensaje ni efecto visual (el stream nunca ve nada).
   Se apaga sola cuando TikTok vuelve a estar "conectado". ?alarm=0 la desactiva. */
const ALARM = (() => {
  const enabled = new URLSearchParams(location.search).get('alarm') !== '0';
  let active = false, pend = 0, loop = 0;
  const beat = () => SFX.force('siren');
  const start = () => { if(active || !enabled) return; active = true; beat(); loop = setInterval(beat, 1500); };
  const stop = () => {
    clearTimeout(pend); pend = 0;
    if(!active) return;
    active = false; clearInterval(loop);
    SFX.force('back');
  };
  return {
    down(){ if(active || pend || !enabled) return; pend = setTimeout(() => { pend = 0; start(); }, 3000); },
    up(){ stop(); },
    now(){ start(); },
    toggle(){ active ? stop() : start(); },
    get active(){ return active; }
  };
})();

/* ============ FESTEJO DE REGALOS ============
   Cada regalo dispara una pantalla de fiesta: rayos giratorios, borde arcoíris, regalo gigante rebotando, nombre del
   espectador, fuegos artificiales de emojis y fanfarria + aplausos. Los regalos grandes (MEGA) duran más y suenan doble. */
const FIESTA = (() => {
  const el = document.createElement('div'); el.id = 'fiesta'; el.setAttribute('aria-hidden','true');
  el.innerHTML = '<div class="ry"></div><div class="ed"></div><div class="bx"><div class="ic">🎁</div><div class="tt">¡REGALO!</div><div class="nn"></div></div>';
  document.body.appendChild(el);
  const ic = el.querySelector('.ic'), tt = el.querySelector('.tt'), nn = el.querySelector('.nn');
  let tm = 0, fwt = 0;
  function fireworks(n, set){
    for(let i=0;i<n;i++){
      const f = document.createElement('i'); f.className = 'fw'; f.textContent = set[Math.random()*set.length|0];
      const cx = innerWidth * (.15 + Math.random()*.7), cy = innerHeight * (.1 + Math.random()*.5), a = Math.random()*Math.PI*2, d = 60 + Math.random()*200;
      f.style.cssText = `left:${cx}px;top:${cy}px;font-size:${18 + Math.random()*26}px;font-style:normal`;
      el.appendChild(f);
      f.animate([{transform:'translate(0,0) scale(.3) rotate(0)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d + 90}px) scale(1.2) rotate(${Math.random()*540-270}deg)`,opacity:0}],
        {duration:1100 + Math.random()*900, delay:Math.random()*400, easing:'cubic-bezier(.2,.7,.4,1)', fill:'both'}).onfinish = () => f.remove();
    }
  }
  return {
    go(name, tier, count){
      const mega = tier && tier.sfx === 'mega', big = tier && tier.min >= 5;
      clearTimeout(tm); clearInterval(fwt);
      el.className = 'on' + (mega ? ' mega' : '');
      void el.offsetWidth;                                   // reinicia la animación si llegan regalos seguidos
      ic.textContent = tier ? tier.icon : '🎁';
      tt.textContent = mega ? '¡MEGA REGALO!' : big ? '¡SÚPER REGALO!' : '¡REGALO!';
      nn.textContent = name ? name + (count > 1 ? ' ×' + count : '') : '';
      SFX.play(mega ? 'fiestaMega' : 'fiesta');
      if(RM >= 1){
        const set = ['🎁','🎉','🎊','✨','⭐','💛','🌟'];
        fireworks(mega ? 46 : 26, set);
        fwt = setInterval(() => fireworks(mega ? 22 : 12, set), 800);
        confetti(mega ? 120 : 70, set);
      }
      const ms = mega ? 5200 : big ? 4000 : 3200;
      tm = setTimeout(() => { clearInterval(fwt); el.classList.add('out'); tm = setTimeout(() => { el.className = ''; }, 500); }, ms);
    }
  };
})();

/* ============ API PÚBLICA ============ */
const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function sim(a,b){ // similitud 0..1 (Levenshtein)
  if(a===b) return 1;
  const m=a.length, n=b.length; if(!m||!n) return 0;
  let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const cur=[i];
    for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur; }
  return 1-prev[n]/Math.max(m,n);
}
/* Normaliza el comentario y busca países reconocidos, aunque todavía no tengan carril. */
function findCountry(text){
  const t = norm(text), words = t.split(/[^a-z0-9]+/).filter(Boolean);
  let best = null, bestS = 0;
  for(const c of ALL_COUNTRIES) for(const a0 of c.alias){
    const a = norm(a0);
    if(!/[a-z]/.test(a)){ if(t.includes(a)) return c; continue; } // emoji de bandera
    for(const w of words){
      const s = (a.length<=5 || w.length<3) ? (w===a?1:0) : sim(w,a); // siglas cortas: solo exactas
      if(s>bestS){ bestS=s; best=c; }
    }
  }
  return bestS >= CONFIG.MATCH ? best : null;
}
/* Si el espectador aún no tiene país, se le asigna uno al azar */
function ensureCountry(user){
  if(lastChoice[user] && COUNTRIES.some(c=>c.id===lastChoice[user])) return lastChoice[user];
  delete lastChoice[user];
  if(!CONFIG.RANDOM_ASSIGN || !COUNTRIES.length) return null;
  return lastChoice[user] = COUNTRIES[Math.random()*COUNTRIES.length|0].id;
}

function recordCountryInteraction(id){
  if(racing && id in countryInteractions) countryInteractions[id]++;
}

function addPoints(id, pts, user, type){
  if(!racing || !(id in state)) return;
  const before = state[id];
  state[id] += pts;
  kick(id);
  if(user) SFX.play(type || 'chat');
  [25,50,75].forEach(m=>{ if(before < m && state[id] >= m && !fxHit[m]){ fxHit[m] = 1; SFX.play('milestone'); } });
  if(state[id] >= CONFIG.GOAL*.85 && state[id] < CONFIG.GOAL && !fxHit.f){ fxHit.f = 1; SFX.play('final'); }
  if(user){
    contrib[id][user] = (contrib[id][user]||0) + pts;
    gainFx(id, pts, type || 'chat', user);
    appear(id, user, type || 'chat');
  }
  render();
  if(state[id] >= CONFIG.GOAL) win(id);
}

/* Aviso flotante "+3 m" con el ícono del evento sobre la tortuga que avanzó */
function gainFx(id, pts, type, user){
  const t = document.getElementById('t-'+id); if(!t) return;
  t.querySelectorAll('.gain').forEach((g,i,all)=>{ if(all.length > 2) g.remove(); });
  const g = document.createElement('span');
  const tb = type === 'gift';
  g.className = 'gain' + (tb ? ' turbo' : ''); g.textContent = tb ? `🚀 TURBO +${pts} m` : `${ICONS[type]||''} +${pts} m`;
  t.appendChild(g); setTimeout(()=>g.remove(), tb ? 1800 : 1200);
  if(user){ // el avatar del espectador salta sobre la tortuga con su nivel
    t.querySelectorAll('.hop').forEach(h=>h.remove());
    const h = document.createElement('div'), L = lvOf(id,user);
    h.className = 'hop l'+L; h.innerHTML = av(user) + `<b>Nv${L} · +${pts} m</b>`;
    t.appendChild(h); setTimeout(()=>h.remove(), 1400);
  }
}

function prepareNextRace(){
  const results = COUNTRIES.map(c=>({
    id:c.id,
    name:c.name,
    interactions:countryInteractions[c.id] || 0
  }));
  /* Próxima carrera = TODOS los países que interactuaron (hasta 8, sean 4, 6 u 8).
     Si interactuaron menos de 3, se completa hasta 3 con los demás países de esta carrera (los de más actividad primero). */
  const sorted = [...results].sort((a,b)=>b.interactions-a.interactions);
  const active = sorted.filter(r=>r.interactions > 0).slice(0, MAX_LANES);
  const chosen = active.length >= MIN_LANES ? active : [...active, ...sorted.filter(r=>!active.includes(r))].slice(0, MIN_LANES);
  nextCountries = chosen
    .map(result=>ALL_COUNTRIES.find(c=>c.id===result.id))
    .filter(Boolean);
  pendingRaceResult = {raceId:new Date().toISOString(), countries:results};
  sendPendingRaceResult();
  return nextCountries;
}

function sendPendingRaceResult(){
  if(pendingRaceResult && window.TurtleRace && window.TurtleRace.sendBackend){
    window.TurtleRace.sendBackend('race-result', pendingRaceResult);
  }
}

/* Ganador + los 3 que más empujaron (MVP) */
function win(id){
  racing = false;
  SFX.play('win'); setTimeout(()=>SFX.play('cheer'), 400);
  WINS[id] = (WINS[id]||0) + 1; streak = lastWinner === id ? streak + 1 : 1; lastWinner = id; saveWins();
  confetti(100, ['🎉','🏆','⭐','🎊','✨']);
  const next = prepareNextRace();
  Object.values(rig).forEach(r=>{ r.won = r.id===id; r.ovUntil = 0; say(r, r.won ? '🎉' : '😢'); });
  const c = COUNTRIES.find(x=>x.id===id);
  const top = Object.entries(contrib[id]).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const w = document.getElementById('winner');
  const pod = [...COUNTRIES].sort((x,y)=>state[y.id]-state[x.id]).slice(0,3)
    .map((x,i)=>`<div class="pod"><span>${['🥇','🥈','🥉'][i]}</span>${flagMini(x)}<em>${esc(x.name)}</em><small>${Math.min(state[x.id],CONFIG.GOAL)} m</small></div>`).join('');
  const fans = Object.values(lastChoice).filter(x=>x===id).length;
  w.innerHTML = `<div class="wf">${flagMini(c)}</div><b>🏆 ${esc(c.name)}</b>
    <span>🏅 ${WINS[id]} victoria${WINS[id]>1?'s':''}${streak>1?` · 🔥 racha ×${streak}`:''}${fans?` · 👥 ${fans} hinchas`:''}</span>
    <div class="podium">${pod}</div>
    <span>Ellos lo llevaron a la meta</span>
    <div class="mvps">${top.map(([u,p],i)=>`<div class="mvp">${av(u,'big')}<em>${['⭐','🥈','🥉'][i]} ${esc(nm(u))}</em><small>${p} m</small></div>`).join('')}</div>
    <span>Próxima carrera: ${next.map(country=>esc(country.name)).join(' · ')}</span>`;
  w.classList.add('show');
  setTimeout(reset, CONFIG.RESET_MS);
}

/* Cambia de país a un espectador (lo saca de la tripulación anterior) */
function moveTo(user, id){
  const prev = lastChoice[user];
  if(prev && prev!==id && crew[prev]){ crew[prev] = crew[prev].filter(u=>u!==user); drawCrew(prev); }
  lastChoice[user] = id;
}

/* user = id único; avatar = URL de la foto; name = nombre visible (opcional) */
function onChat(user, text, avatar, name){
  countEvent();
  seen(user, avatar, name);
  if(String(text || '').trim()){
    profiles[user].comment = String(text).trim();
    profiles[user].commentAt = Date.now();
  }
  showChat(user, name, text);
  if(!racing) return;
  const c = findCountry(text);
  if(!c || !addCountryToRace(c)){   // sin país reconocido, o carrera llena (8): cuenta como comentario normal
    SFX.play('chat');
    const g = ensureCountry(user);
    if(g){ recordCountryInteraction(g); appear(g, user, 'chat'); }
    render();
    return;
  }
  moveTo(user, c.id); // pasa al país que comentó
  recordCountryInteraction(c.id);
  addPoints(c.id, CONFIG.POINTS.chat, user, 'chat');
}
function showChat(user, name, text){
  const comment = String(text || '').trim();
  if(!comment) return;
  const entry = document.createElement('div');
  const avatar = document.createElement('div');
  const copy = document.createElement('div');
  const nickname = document.createElement('b');
  const message = document.createElement('span');
  entry.className = 'comment-entry';
  avatar.innerHTML = av(user);
  copy.className = 'comment-copy';
  nickname.className = 'comment-name';
  nickname.textContent = String(name || user || 'Usuario');
  message.className = 'comment-text';
  message.textContent = comment;
  copy.append(nickname, message);
  entry.append(avatar, copy);
  const feed = document.getElementById('commentFeed');
  feed.prepend(entry);
  while(feed.children.length > 3) feed.lastElementChild.remove();
}
/* Likes/taps: cada LIKES_PER_STEP = 1 paso */
function onLike(user, count = 1, avatar, name){
  countEvent();
  seen(user, avatar, name);
  const id = ensureCountry(user);
  if(!id) return;
  recordCountryInteraction(id);
  const acc = (likeAcc[user] || 0) + count, steps = Math.floor(acc / CONFIG.LIKES_PER_STEP);
  likeAcc[user] = acc % CONFIG.LIKES_PER_STEP;
  if(steps) addPoints(id, steps * CONFIG.POINTS.like, user, 'like');
  else { SFX.play('like'); appear(id, user, 'like'); render(); }
}
/* Seguir y compartir */
function onFollow(user, avatar, name){
  countEvent(); seen(user, avatar, name);
  const id = ensureCountry(user);
  if(id){ recordCountryInteraction(id); addPoints(id, CONFIG.POINTS.follow, user, 'follow'); }
}
function onShare(user, avatar, name){
  countEvent(); seen(user, avatar, name);
  const id = ensureCountry(user);
  if(id){ recordCountryInteraction(id); addPoints(id, CONFIG.POINTS.share, user, 'share'); }
}
/* Regalos (el contador suma regalos recibidos; repeatCount solo determina el nivel y potencia) */
let giftTotal = 0;
function onGift(user, count = 1, avatar, name){
  countEvent(2);
  giftTotal += 1;
  const gEl = document.getElementById('gifts');
  const E = CONFIG.GIFT_LEVEL_EVERY, lv = 1 + Math.floor(giftTotal / E), pc = giftTotal % E * 100 / E;
  if(lv > giftLv){ giftLv = lv; SFX.play('level'); toast(`⭐ ¡NIVEL DE REGALOS ${lv}!`, 'gift'); confetti(50, ['🎁','⭐','✨','💛']); }
  gEl.textContent = `🎁 ${giftTotal} · Nv ${lv}`; gEl.title = `Regalos: ${giftTotal % E}/${E} para el nivel ${lv+1}`;
  gEl.style.background = `linear-gradient(90deg,#ffd75e ${pc}%,#fff1c2 ${pc}%)`;
  gEl.classList.remove('bump'); void gEl.offsetWidth; gEl.classList.add('bump');
  seen(user, avatar, name);
  const id = ensureCountry(user), tier = [...CONFIG.GIFT_TIERS].reverse().find(t => count >= t.min) || CONFIG.GIFT_TIERS[0];
  if(id && rig[id]){
    recordCountryInteraction(id);
    react(rig[id],'love',2.5,'❤️'); rig[id].turbo = T0 + tier.turbo;   // modo TURBO (más largo en regalos grandes)
  }
  if(id){
    const pts = Math.round(CONFIG.POINTS.gift * tier.mult * (CONFIG.GIFT_PER_UNIT ? count : 1)), c = COUNTRIES.find(x=>x.id===id);
    SFX.play(tier.sfx);
    toast(`${tier.icon} ${esc(nm(user))} · ${tier.name}${count>1?' ×'+count:''} → ${esc(c.name)} +${pts} m`, 'gift');
    confetti(tier.confetti, ['🎁','✨','⭐','💛']);
    addPoints(id, pts, user, 'gift');
  }
  FIESTA.go(nm(user), tier, count);   // ¡festejo a pantalla completa por cada regalo!
}
window.TurtleRace = { setRotating, onFollow, onShare, onLike, onChat, onGift, addPoints, reset, config: CONFIG };

/* ============ CONEXIÓN CON EL BACKEND (opcional) ============
   CONTRATO OVERLAY <-> BACKEND NODE  (conector NO oficial de TikTok, p. ej. tiktok-live-connector)

   Transporte
   - El overlay es CLIENTE WebSocket. Se abre con  ?ws=ws://localhost:21213  (puerto a elección).
   - El backend envía eventos y el overlay devuelve el resumen por país al terminar cada carrera.
     Si se cae, reintenta cada 3 s durante 5 min (CONFIG.RETRY_MS / RETRY_MAX_MS); después se detiene hasta tocar el aviso o el ⚙.
   - El botón ⚙ de la barra abre la página de configuración del backend (usuario de TikTok): ?cfg=http://… o, por defecto, el mismo host:puerto del ws en http.
   - Un mensaje = un JSON de texto con esta forma:  {"event": "<tipo>", "data": { ... }}
   - race-history   (backend -> overlay): últimos eventos guardados por país para elegir las 3 tortugas iniciales.
   - race-result    (overlay -> backend): países y cantidad de eventos de la carrera recién terminada.
   - JSON inválido o eventos desconocidos se ignoran en silencio (no rompen el overlay).

   Eventos  (event -> campos de data; "id" es el usuario, estable, p. ej. @usuario)
   - chat    uniqueId, nickname, profilePictureUrl, comment      -> si el comentario nombra un país, el espectador se mueve a él y suma CONFIG.POINTS.chat
   - like    uniqueId, nickname, profilePictureUrl, likeCount    -> cada LIKES_PER_STEP likes acumulados por usuario suman CONFIG.POINTS.like
   - follow  uniqueId, nickname, profilePictureUrl               -> suma CONFIG.POINTS.follow
   - share   uniqueId, nickname, profilePictureUrl               -> suma CONFIG.POINTS.share
   - gift    uniqueId, nickname, profilePictureUrl, repeatCount  -> suma CONFIG.POINTS.gift (25 m = 25 %) y modo TURBO; con GIFT_PER_UNIT:true se multiplica por repeatCount

   Reglas de campos
   - uniqueId   obligatorio en la práctica: identifica al espectador (país elegido, acumulado de likes, MVP).
                Si falta, el overlay usa nickname, y si tampoco, agrupa todo en "viewer".
   - nickname   nombre visible; si falta se muestra uniqueId.
   - profilePictureUrl  opcional. Alias aceptados: avatar, user.profilePicture.url, profilePicture.url.
                Si falta o la imagen no carga, se dibuja un círculo con la inicial. Ojo: las URLs de la CDN de TikTok caducan.
   - comment    texto crudo del chat (alias: text, content). La detección de país es tolerante a tildes, mayúsculas y faltas leves.
   - likeCount / repeatCount  enteros >= 1 (alias: count). Si vienen vacíos se asume 1.
   - Los campos pueden ir en data o en la raíz del mensaje; el tipo puede ir en "event" o en "type".

   Responsabilidades del BACKEND (el overlay no las hace)
   - Regalos con racha (giftType === 1 en el conector): enviar SOLO cuando termine la racha (repeatEnd === true),
     con el repeatCount final; si no, el mismo regalo se cuenta varias veces.
   - Los likes llegan en ráfagas: se pueden enviar tal cual (el overlay acumula) o agrupados sumando likeCount.
   - Reconexión al live y manejo de errores del conector (si el live no está activo, reintentar cada 3 s hasta 5 min).
   - Filtrado de spam o bots, si se necesita.

   Aviso: un conector no oficial depende de endpoints internos de TikTok sin garantías: puede dejar de funcionar
   sin previo aviso y su uso puede ir contra los términos de TikTok. Aísla el conector en el backend para poder
   cambiarlo sin tocar el overlay. Revisa los nombres de eventos según la versión del conector.

   Ejemplo mínimo de backend (Node, npm i ws tiktok-live-connector):
     const { WebSocketServer } = require('ws');
     const { WebcastPushConnection } = require('tiktok-live-connector');
     const wss = new WebSocketServer({ port: 21213 });
     const send = (event, data) => { const m = JSON.stringify({ event, data }); wss.clients.forEach(c => c.readyState === 1 && c.send(m)); };
     const base = d => ({ uniqueId: d.uniqueId, nickname: d.nickname, profilePictureUrl: d.profilePictureUrl });
     const tt = new WebcastPushConnection(process.env.TIKTOK_USER || 'tortulive');
     tt.connect().catch(console.error);
     tt.on('chat',   d => send('chat',   { ...base(d), comment: d.comment }));
     tt.on('like',   d => send('like',   { ...base(d), likeCount: d.likeCount }));
     tt.on('follow', d => send('follow', base(d)));
     tt.on('share',  d => send('share',  base(d)));
     tt.on('gift',   d => { if (d.giftType === 1 && !d.repeatEnd) return; send('gift', { ...base(d), repeatCount: d.repeatCount }); });

   Pruebas sin backend: panel de botones (?panel=1) o TurtleRace.onFollow('ana'), onShare, onLike, onGift, onChat.
*/
function connectWS(url){
  const st = document.getElementById('status');
  let t0 = 0, timer = 0, ws = null;
  const dot = document.getElementById('dot');
  const setDot = (c, t) => { dot.className = c; dot.title = t; dot.setAttribute('aria-label', t); };
  setDot('wait', 'Conectando…');
  const show = () => {};   // sin mensajes visuales de conexión/desconexión (el estado solo se ve en el puntito de la barra)
  const open = () => {
    clearTimeout(timer);
    if(!t0) t0 = Date.now();
    ws = new WebSocket(url);
    window.TurtleRace.sendBackend = (event,data) => {
      if(ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({event,data}));
    };
    ws.onopen  = () => {
      t0 = 0; setDot('wait', 'Servidor conectado; comprobando TikTok'); show('Servidor conectado', 2000);
      window.TurtleRace.sendBackend('connect', { username: CONFIG.TIKTOK_USER });   // usuario por defecto: tortulive (?user= lo cambia)
      sendPendingRaceResult();
    };
    ws.onclose = () => {
      ALARM.down();   // servidor caído: arma la alarma (3 s de gracia)
      const left = CONFIG.RETRY_MAX_MS - (Date.now() - t0);
      if(left > 0){ setDot('wait', 'Conectando…'); show('Reconectando… (' + Math.ceil(left/60000) + ' min restantes)'); timer = setTimeout(open, CONFIG.RETRY_MS); }
      else { t0 = 0; setDot('fail', 'Falló tras 5 min'); show('Sin conexión · toca aquí o ⚙ para configurar'); }   // pasaron 5 min: deja de insistir
    };
    ws.onmessage = (m) => {
      try{
        const msg = JSON.parse(m.data), d = msg.data || msg, ev = msg.event || msg.type;
        if(ev === 'race-history'){ initializeRace(d.countries); return; }
        if(ev === 'race-result-saved'){
          if(pendingRaceResult && pendingRaceResult.raceId === d.raceId) pendingRaceResult = null;
          return;
        }
        if(ev === 'race-result-error'){ console.error('No se guardaron las interacciones por país:', d.error); return; }
        const user = d.uniqueId || d.nickname || d.user || 'viewer', name = d.nickname || d.uniqueId || user;
        const pic = d.profilePictureUrl || d.avatar || (d.user && d.user.profilePicture && d.user.profilePicture.url) || (d.profilePicture && d.profilePicture.url) || '';
        if(ev === 'status'){
          const live = document.getElementById('liveuser');
          const un = d.username || CONFIG.TIKTOK_USER;
          live.textContent = '@' + un;
          live.title = 'Usuario TikTok: @' + un;
          if(d.status === 'connected'){ setDot('ok', 'TikTok conectado: @' + (d.username || '')); ALARM.up(); }
          else if(d.status === 'failed'){ setDot('fail', d.error || 'No se pudo conectar con TikTok'); ALARM.down(); }
          else if(d.status === 'idle'){ setDot('off', 'TikTok desconectado'); ALARM.down(); }
          else setDot('wait', d.error || 'Conectando a TikTok…');
        }
        else if(ev === 'chat') onChat(user, d.comment || d.text || d.content || '', pic, name);
        else if(ev === 'like') onLike(user, d.likeCount || d.count || 1, pic, name);
        else if(ev === 'follow') onFollow(user, pic, name);
        else if(ev === 'share') onShare(user, pic, name);
        else if(ev === 'gift') onGift(user, d.repeatCount || d.count || 1, pic, name);
      }catch(e){}
    };
  };
  st.style.pointerEvents = 'auto'; st.style.cursor = 'pointer';
  st.addEventListener('click', () => { if(!ws || ws.readyState === 3){ t0 = 0; setDot('wait', 'Conectando…'); open(); } });   // reintento manual
  window.TurtleRace.retryWS = () => { t0 = 0; setDot('wait', 'Conectando…'); open(); };
  open();
}

/* ⚙ Engranaje: abre el backend para configurar el usuario de TikTok.
   URL: ?cfg=… ; si falta, se deduce de ?ws= (ws→http, ws://localhost:21213 → http://localhost:21213/); por defecto http://localhost:21213/ */

/* Ajusta todo el overlay a la pantalla vertical de TikTok Live (9:16): lo escala para que entre completo
   en ancho y alto, centrado. En el navegador de OBS / Live Studio usa el mismo tamaño que la fuente (ej. 1080×1920). ?fit=0 lo desactiva. */
function fitScreen(){
  const q = new URLSearchParams(location.search);
  if(q.get('countries') === '1') return;
  if(q.get('safe') === '0'){ const r = document.documentElement.style; r.setProperty('--safe-t','10px'); r.setProperty('--safe-b','10px'); r.setProperty('--safe-l','10px'); r.setProperty('--safe-r','10px'); }
  const app = document.getElementById('app');
  if(q.get('fit') === '0'){ app.style.transform = app.style.marginLeft = app.style.marginTop = ''; return; }
  app.style.transform = 'none'; app.style.marginLeft = '0'; app.style.marginTop = '0';
  const w = app.offsetWidth, h = app.offsetHeight, k = Math.min(innerWidth / w, innerHeight / h);
  app.style.transformOrigin = 'top left';
  app.style.transform = `scale(${k})`;
  app.style.marginLeft = Math.max(0, (innerWidth - w * k) / 2) + 'px';
  app.style.marginTop = Math.max(0, (innerHeight - h * k) / 2) + 'px';
}

/* ============ PANEL DE PRUEBAS ============
   Oculto por defecto (no sale en el stream). Se muestra con ?panel=1 o con la tecla T. */
(function(){
  const tp = document.getElementById('tp');
  const NAMES = ['Ana','Luis','Majo','Diego','Sofi','Tomás','Lu','Fer','Nico','Cami','Rafa','Vale'];
  /* Oculto por defecto. Para probar: ?panel=1 en la URL o la tecla T. */
  if(new URLSearchParams(location.search).get('panel') === '1') tp.classList.add('on');
  document.addEventListener('keydown', e=>{ if(e.key.toLowerCase()==='t') tp.classList.toggle('on'); });
  const pickId = () => COUNTRIES[Math.random()*COUNTRIES.length|0].id;
  function fire(kind){
    const u = NAMES[Math.random()*NAMES.length|0], id = pickId();
    moveTo(u, id);                       // el espectador queda en el país elegido
    if(kind==='chat')   onChat(u, COUNTRIES.find(c=>c.id===id).name, '', u);
    if(kind==='like')   onLike(u, 3, '', u);
    if(kind==='follow') onFollow(u, '', u);
    if(kind==='share')  onShare(u, '', u);
    if(kind==='gift')   onGift(u, [1,1,5,12][Math.random()*4|0], '', u);
  }
  tp.addEventListener('click', e=>{
    const b = e.target.closest('button[data-ev]'); if(!b) return;
    const k = b.dataset.ev;
    if(k==='burst'){ const ks=['chat','like','follow','share','gift']; for(let i=0;i<20;i++) setTimeout(()=>fire(ks[Math.random()*ks.length|0]), i*120); }
    else if(k==='win'){
      if(!racing) return;
      let id = COUNTRIES[0].id; COUNTRIES.forEach(c=>{ if(state[c.id] > state[id]) id = c.id; });
      seen('Test','','Test'); addPoints(id, CONFIG.GOAL - state[id], 'Test', 'chat');
    }
    else if(k==='next') reset();
    else if(k==='cta'){
      const now = Date.now();
      evts.splice(0, evts.length, ...Array.from({length:51}, (_, i) => now - i));
      rosaCheck();
    }
    else if(k==='newc'){ const out = ALL_COUNTRIES.filter(c=>!COUNTRIES.some(x=>x.id===c.id)); if(out.length){ const c = out[Math.random()*out.length|0]; onChat(NAMES[Math.random()*NAMES.length|0], c.name, '', ''); } }
    else if(k==='alarm') ALARM.toggle();
    else fire(k);
  });
})();

    }, 250);
  }
}

<script>
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1')){
  navigator.serviceWorker.register('/sw.js').catch(error=>console.error('No se pudo registrar la app instalable',error));
}
let screenLock = null, requestingScreenLock = false;
async function keepScreenOn(){
  if(!('wakeLock' in navigator) || document.visibilityState!=='visible' || screenLock || requestingScreenLock) return;
  requestingScreenLock = true;
  try{
    const lock = await navigator.wakeLock.request('screen');
    screenLock = lock;
    lock.addEventListener('release',()=>{ if(screenLock===lock) screenLock=null; });
  }catch(error){ console.warn('No se pudo mantener la pantalla encendida',error); }
  finally{ requestingScreenLock = false; }
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') keepScreenOn(); });
keepScreenOn();
</script>
